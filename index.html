<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bemo Coverage Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Charging stations map</h1>
  <label class="file">Upload CSV file(s)
    <input id="file" type="file" accept=".csv,text/csv" multiple>
  </label>
  <button id="clear" type="button">Clear</button>
  <span id="status">Load a CSV with latitude and longitude columns (lat/lng, latitude/longitude, lon...).</span>
</header>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="csv.js"></script>
<script src="app.js"></script>
</body>
</html>
